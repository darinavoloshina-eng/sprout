/* right: download */
.right{left:2160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 100px;box-sizing:border-box}
.right h2{font-family:'Fraunces',serif;font-weight:600;font-size:132px;line-height:1.02;margin:0;letter-spacing:-2px}
.right h2 em{font-style:italic;font-weight:500;color:#E3B94C}
.right p{font-size:48px;line-height:1.4;color:#CFE0CD;margin:40px 0 0;text-wrap:balance}
.right .badge{width:520px;margin-top:70px}
